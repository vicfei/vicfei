  <rect x="4" y="4" width="952" height="422" rx="14" fill="#F6F8FA" stroke="#C6CDD5" stroke-width="1.5"/>

  <text x="48" y="42" font-size="12.5" font-weight="800" fill="#1B2A4A">THE JEV LOOP</text>
  <text x="160" y="42" font-size="11" fill="#8B949E">— four repos, one workflow: the library supplies the questions, the benchmark measures them, the skill chains them, the model trains on them</text>

  <!-- loop cards -->
  <rect x="44" y="58" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#F2B33D" stroke-width="2"/>
  <text x="146" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">awesome-jev-prompts</text>
  <text x="146" y="108" text-anchor="middle" font-size="10.5" fill="#57606A">question patterns</text>
  <text x="146" y="124" text-anchor="middle" font-size="10.5" fill="#57606A">linter · cookbook · leaderboard</text>
  <text x="146" y="143" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8B949E">the questions</text>

  <rect x="284" y="58" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="386" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">jev-rag-zh-benchmark</text>
  <text x="386" y="108" text-anchor="middle" font-size="10.5" fill="#57606A">Chinese reranking benchmark</text>
  <text x="386" y="124" text-anchor="middle" font-size="10.5" fill="#57606A">Zenodo DOI · full logs</text>
  <text x="386" y="143" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8B949E">the measurement</text>

  <rect x="524" y="58" width="204" height="96" rx="10" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="626" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">jev-pipeline-skill</text>
  <text x="626" y="108" text-anchor="middle" font-size="10.5" fill="#57606A">find → fit → draft → lint →</text>
  <text x="626" y="124" text-anchor="middle" font-size="10.5" fill="#57606A">spread → threshold → cascade</text>
  <text x="626" y="143" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8B949E">the workflow</text>

  <rect x="764" y="58" width="156" height="96" rx="10" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="842" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">minimind-jev</text>
  <text x="842" y="108" text-anchor="middle" font-size="10.5" fill="#57606A">from-scratch tiny models</text>
  <text x="842" y="124" text-anchor="middle" font-size="10.5" fill="#57606A">full Chinese tutorial</text>
  <text x="842" y="143" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8B949E">the model</text>

  <line x1="248" y1="106" x2="282" y2="106" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="488" y1="106" x2="522" y2="106" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="728" y1="106" x2="762" y2="106" stroke="#57606A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- feedback dashed arrow -->
  <path d="M 842,158 C 842,178 146,178 146,160" fill="none" stroke="#F2B33D" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrg)"/>
  <text x="494" y="184" text-anchor="middle" font-size="9.5" font-style="italic" fill="#B7791F">checkpoints &amp; negative results feed new patterns</text>

  <!-- new lines -->
  <text x="48" y="222" font-size="12.5" font-weight="800" fill="#1B2A4A">NEW LINES</text>
  <text x="126" y="222" font-size="11" fill="#8B949E">— 2026 Q4: the Super-agent authorization wedge, and the AI × quant bridge</text>

  <rect x="44" y="238" width="280" height="92" rx="10" fill="#1B2A4A"/>
  <text x="184" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#F2B33D">dsh-super-agent</text>
  <text x="184" y="288" text-anchor="middle" font-size="10.5" fill="#FFFFFF">admission control · observe mode · tickets</text>
  <text x="184" y="304" text-anchor="middle" font-size="10.5" fill="#9FB0CC">for any CLI coding agent — claude · codex · opencode</text>
  <text x="184" y="321" text-anchor="middle" font-size="9.5" font-style="italic" fill="#9FB0CC">DeepSeek Super-agent design, independently</text>

  <rect x="348" y="238" width="280" height="92" rx="10" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="488" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">awesome-ai-quant</text>
  <text x="488" y="288" text-anchor="middle" font-size="10.5" fill="#57606A">AI engineering × quantitative finance</text>
  <text x="488" y="304" text-anchor="middle" font-size="10.5" fill="#57606A">trading agents · factor discovery</text>
  <text x="488" y="321" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8B949E">decision models as the new factor engine</text>

  <rect x="652" y="238" width="268" height="92" rx="10" fill="#FFFFFF" stroke="#C6CDD5" stroke-width="1.5"/>
  <text x="786" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">WeKnora</text>
  <text x="786" y="288" text-anchor="middle" font-size="10.5" fill="#57606A">contributor — rank #17</text>
  <text x="786" y="304" text-anchor="middle" font-size="10.5" fill="#57606A">Tencent's LLM knowledge platform</text>
  <text x="786" y="321" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8B949E">where the RAG habits come from</text>

  <!-- footer -->
  <rect x="44" y="352" width="876" height="42" rx="10" fill="#1B2A4A"/>
  <text x="482" y="378" text-anchor="middle" font-size="12" font-style="italic" fill="#F2B33D">questions describe judgments — code owns composition, thresholds, and side effects</text>

  <text x="482" y="416" text-anchor="middle" font-size="10" fill="#8B949E">RAG systems · Jev decision models · AI × quant</text>
